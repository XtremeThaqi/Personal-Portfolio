name: Portfolio checks

on:
  push:
    branches: [feat/content-project-showcase]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: portfolio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PORTFOLIO_TOOLING_DIR: /tmp/portfolio-tools
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Record existing dependency advisories
        run: |
          mkdir -p artifacts
          npm audit --json > artifacts/dependency-audit.json || true
          node -e 'const r=require("./artifacts/dependency-audit.json"); console.log("AUDIT:"+JSON.stringify(Object.values(r.vulnerabilities || {}).map(({name,severity,isDirect,fixAvailable,via})=>({name,severity,isDirect,fixAvailable,via}))));'
      - run: npm run lint
      - name: Build production
        run: npm run build
        env:
          CONTEXT: production
      - name: Install isolated browser tooling
        run: npm install --prefix "$PORTFOLIO_TOOLING_DIR" --no-save playwright lighthouse
      - run: node "$PORTFOLIO_TOOLING_DIR/node_modules/playwright/cli.js" install --with-deps chromium
      - name: Browser, contact and Lighthouse checks
        run: node scripts/check-responsive.mjs
        env:
          RUN_LIGHTHOUSE: "1"
      - name: Build preview
        run: npm run build
        env:
          CONTEXT: deploy-preview
          DEPLOY_PRIME_URL: https://deploy-preview-1--erblinthaqi.netlify.app
      - name: Verify preview indexing protection
        run: node scripts/check-responsive.mjs --preview
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-review
          path: artifacts/
          if-no-files-found: ignore
